version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: lab_node_app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - /app/node_modules # prevents your host from overwriting container node_modules
    command: npx nodemon index.js  # or node --watch index.js (built into Node 20+)
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking_db
    depends_on:
      db:
        condition: service_healthy