events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 1. Shared memory zone tracking client IPs
    # Key: $binary_remote_addr (4 bytes per IPv4 vs 7-15 bytes for text)
    # Zone: "api_limit", size 10MB (can hold ~160,000 IP addresses)
    # Rate: 2 requests per second (r/s)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

    # Custom HTTP status code when rejected (default is 503)
    limit_req_status 429;

    upstream backend_cluster {
        server app1:5678;
        server app2:5678;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /ping {
            return 200 'pong\n';
            add_header Content-Type text/plain;
        }

        location /api/ {
            # 2. Apply the limit with a burst queue
            # burst=3: Allows up to 3 requests in excess of rate to queue up
            # nodelay: Process the burst requests immediately instead of delaying them
            limit_req zone=api_limit burst=3 nodelay;

            proxy_pass http://backend_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}