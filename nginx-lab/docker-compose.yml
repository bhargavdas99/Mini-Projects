services:
  nginx:
    image: nginx:alpine
    container_name: my-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  app1:
    image: hashicorp/http-echo:latest
    container_name: app1
    command: ["-text=Hello from Backend App 1!"]
    # Notice: NO ports published to the host. Only accessible via Docker network.
  
  app2:
    image: hashicorp/http-echo:latest
    container_name: app2
    command: ["-text=Response from App 2"]